apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-addons
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/cavalcante001/descomplicando-gitops-no-kubernetes-argocd.git
              revision: feat/day3
              directories:
              - path: applicationset/apps/*/helm
          - git:
              repoURL: https://github.com/cavalcante001/descomplicando-gitops-no-kubernetes-argocd.git
              revision: feat/day3
              pathParamPrefix: cfg
              files:
                - path: applicationset/cofigs/dev.json
  template:
    metadata:
      name: '{{index .path.segments 2}}-{{.cluster.nome}}'
    spec:
      project: "default"
      source:
        repoURL: https://github.com/cavalcante001/descomplicando-gitops-no-kubernetes-argocd.git
        targetRevision: feat/day3
        path: '{{.path.path}}'
        helm:
          parameters:
          - name: "cluster"
            value: '{{.cluster.nome}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{index .path.segments 2}}'
      syncPolicy:
        automated:
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        - Prune=true